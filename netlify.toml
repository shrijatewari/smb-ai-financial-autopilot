# Netlify: monorepo — publish path is relative to repo root
[build]
  base = "financial-control-ui"
  command = "npm run build"
  # Relative to `base` (monorepo); not repo-root/financial-control-ui/dist twice.
  publish = "dist"

# Baked into the JS bundle at build time (must match your Fly / public API origin, no trailing slash).
[build.environment]
  VITE_API_URL = "https://smb-financial-api.fly.dev"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
